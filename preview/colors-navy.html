<!doctype html>
<!-- @dsCard group="Colors" name="Navy palette" subtitle="All 7 official brand anchors, matching the brand-sheet" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:#fff;font-family:var(--font-body);color:var(--fg-1)}
  .card{padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg-3);font-weight:500}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .pill{width:100%;aspect-ratio:.42;border-radius:9999px}
  .hex{font-family:var(--font-body);font-size:10px;letter-spacing:.04em;color:var(--fg-2)}
  .cmyk{font-family:var(--font-body);font-size:9px;letter-spacing:.04em;color:var(--fg-3);line-height:1.3;text-align:center}
</style></head>
<body>
<div class="card">
  <div class="label">Official ATRIA brand palette &nbsp;·&nbsp; 7 anchor colors</div>
  <div class="row">
    <div class="col"><div class="pill" style="background:#003173"></div><span class="cmyk">C100 M85 Y5 K30</span><span class="hex">#003173</span></div>
    <div class="col"><div class="pill" style="background:#E8412A"></div><span class="cmyk">C0 M85 Y87 K0</span><span class="hex">#E8412A</span></div>
    <div class="col"><div class="pill" style="background:#B0874E"></div><span class="cmyk">C26 M42 Y72 K15</span><span class="hex">#B0874E</span></div>
    <div class="col"><div class="pill" style="background:#BABDC6"></div><span class="cmyk">C31 M22 Y17 K0</span><span class="hex">#BABDC6</span></div>
    <div class="col"><div class="pill" style="background:#687687"></div><span class="cmyk">C61 M43 Y32 K15</span><span class="hex">#687687</span></div>
    <div class="col"><div class="pill" style="background:#94BEE6"></div><span class="cmyk">C46 M15 Y0 K0</span><span class="hex">#94BEE6</span></div>
    <div class="col"><div class="pill" style="background:#00529F"></div><span class="cmyk">C95 M68 Y0 K0</span><span class="hex">#00529F</span></div>
  </div>
</div>
</body></html>
