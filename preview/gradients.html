<!doctype html>
<!-- @dsCard group="Colors" name="Signature gradients" subtitle="Navy, red, split, and radial variants" viewport="700x180" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:10px}
  .grad{flex:1;height:120px;border-radius:14px;position:relative;overflow:hidden;color:#fff;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;display:flex;align-items:flex-end;padding:10px 12px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg-3);font-weight:500}
</style></head>
<body>
<div class="card">
  <div class="label">Signature gradients — used on every social card</div>
  <div class="row">
    <div class="grad" style="background:var(--grad-navy)">Navy vertical</div>
    <div class="grad" style="background:var(--grad-red)">Red vertical</div>
    <div class="grad" style="background:var(--grad-split)">Red→navy split</div>
    <div class="grad" style="background:var(--grad-radial-navy)">Radial navy</div>
    <div class="grad" style="background:var(--grad-radial-red)">Radial red</div>
  </div>
</div>
</body></html>
