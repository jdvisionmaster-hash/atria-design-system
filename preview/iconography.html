<!doctype html>
<!-- @dsCard group="Brand" name="Iconography" subtitle="3D placeholders, status glyphs, IG action row" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:10px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg-3);font-weight:500}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .ic-3d{width:88px;height:88px;border-radius:20px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff,#E5E9EE);color:var(--atria-steel-500);font-family:var(--font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;text-align:center;line-height:1.15;border:1px dashed var(--atria-steel-300)}
  .gl{width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;color:#fff;font-size:18px}
  .gl.x{background:linear-gradient(180deg,#F25C44,#A82516)}
  .gl.v{background:linear-gradient(180deg,#94BEE6,#00529F)}
  .ig{display:flex;gap:14px;color:var(--atria-navy-900)}
  .ig svg{width:22px;height:22px}
  .legend{font-size:12px;color:var(--fg-2);max-width:560px}
</style></head>
<body>
<div class="card">
  <div class="label">Iconography &nbsp;·&nbsp; 3D hero objects (placeholders), status glyphs, social row</div>
  <div class="row">
    <div class="ic-3d">3D<br>Megáfono</div>
    <div class="ic-3d">3D<br>Mazo / gavel</div>
    <div class="ic-3d">3D<br>Pulgar abajo</div>
    <div class="ic-3d">3D<br>Cubos $</div>
    <div class="gl x">✕</div>
    <div class="gl v">✓</div>
    <div class="ig" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.5-9-9.5C1.5 7 5 4 8 5c1.5.5 3 2 4 3 1-1 2.5-2.5 4-3 3-1 6.5 2 5 6.5C19 16.5 12 21 12 21Z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a8 8 0 1 1-3.6-6.7L21 4l-1.3 3.7A8 8 0 0 1 21 12Z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16Z"/></svg>
    </div>
  </div>
  <p class="legend">3D objects are commissioned PNGs — the project keeps labeled placeholders only. Status glyphs and the IG action row are drawn in CSS/SVG to brand spec.</p>
</div>
</body></html>
