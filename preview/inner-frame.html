<!doctype html>
<!-- @dsCard group="Brand" name="Inner frame motif" subtitle="The 1.5px white inset border on every card" viewport="700x380" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body)}
  .wrap{padding:14px}
  .frame{width:100%;aspect-ratio:4/5;max-height:340px;border-radius:18px;background:var(--grad-radial-navy);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .inner{position:absolute;inset:18px;border:1.5px solid rgba(255,255,255,.22);border-radius:24px;pointer-events:none}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:rgba(255,255,255,.75);font-weight:500;text-align:center;line-height:1.4}
  .label b{display:block;color:#fff;font-size:18px;letter-spacing:.05em;font-weight:700;margin-top:4px}
  .circuit{position:absolute;inset:0;background:radial-gradient(120% 80% at 100% 100%, rgba(111,160,227,.22) 0%, transparent 55%), radial-gradient(80% 60% at 0% 0%, rgba(111,160,227,.18) 0%, transparent 60%);mix-blend-mode:screen;pointer-events:none}
</style></head>
<body>
<div class="wrap">
  <div class="frame">
    <div class="circuit"></div>
    <div class="inner"></div>
    <div class="label">The signature<b>Inner Frame</b>1.5px · rgba(255,255,255,.22) · radius 24</div>
  </div>
</div>
</body></html>
