<!doctype html>
<!-- @dsCard group="Brand" name="Logo lockups" subtitle="Icon, wordmark, and circular badge variants" viewport="700x340" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body)}
  .card{padding:14px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .slot{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .l{background:#fff;border:1px solid var(--border-on-light)}
  .d{background:var(--atria-navy-900)}
  .g{background:var(--atria-gold-500)}
  .slot img{max-width:78%;max-height:78%;object-fit:contain}
</style></head>
<body>
<div class="card">
  <div class="slot l"><img src="../assets/logos/atria-icon-navy-red.png" alt=""></div>
  <div class="slot l"><img src="../assets/logos/atria-wordmark-red.png" alt=""></div>
  <div class="slot l"><img src="../assets/logos/atria-wordmark-gold.png" alt=""></div>
  <div class="slot l"><img src="../assets/logos/atria-icon-navy-gold.png" alt=""></div>
  <div class="slot d"><img src="../assets/logos/atria-badge-navy-red.png" alt=""></div>
  <div class="slot d"><img src="../assets/logos/atria-badge-navy.png" alt=""></div>
  <div class="slot g"><img src="../assets/logos/atria-badge-gold.png" alt=""></div>
  <div class="slot d"><img src="../assets/logos/atria-icon-navy-red.png" alt="" style="filter:brightness(1.15)"></div>
</div>
</body></html>
