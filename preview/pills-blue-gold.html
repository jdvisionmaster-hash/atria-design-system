<!doctype html>
<!-- @dsCard group="Components" name="Status pill · buena fe + gold pill" subtitle="Blue ✓ chip and gold outline keyword" viewport="700x240" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:linear-gradient(180deg,#00529F 0%, #003173 60%, #001A3F 100%);font-family:var(--font-body);color:#fff}
  .card{padding:22px 26px;display:flex;flex-direction:column;gap:10px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:rgba(255,255,255,.7);font-weight:500}
  .pill-good{display:inline-flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(214,227,247,.78),rgba(214,227,247,.32));backdrop-filter:blur(6px);border-radius:36px;padding:10px 28px 10px 10px;border:1px solid rgba(255,255,255,.35);max-width:360px}
  .pill-good .v{width:40px;height:40px;border-radius:9999px;background:linear-gradient(180deg,#94BEE6,#00529F);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.2)}
  .pill-good .t{font-family:var(--font-display);font-weight:700;text-transform:none;color:var(--atria-navy-900);font-size:18px;line-height:1.15}
  .out{display:inline-block;border:2px solid var(--atria-gold-300);border-radius:9999px;padding:8px 18px;color:var(--atria-gold-300);font-family:var(--font-display);text-transform:uppercase;font-weight:700;letter-spacing:.04em;font-size:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style></head>
<body>
<div class="card">
  <div class="label">Status pill — "buena fe" (good faith) action &nbsp;·&nbsp; Gold outline pill — keyword</div>
  <div class="pill-good"><span class="v">✓</span><span class="t">Te ayuda a reorganizar tus deudas</span></div>
  <div class="row">
    <span class="out">"INSOLVENCIA"</span>
    <span class="out">"DERECHO"</span>
  </div>
</div>
</body></html>
