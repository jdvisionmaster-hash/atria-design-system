<!doctype html>
<!-- @dsCard group="Components" name="Status pill · mala fe" subtitle="Red ✕ chips on red surface" viewport="700x260" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:linear-gradient(180deg,#F25C44 0%, #E8412A 60%, #A82516 100%);font-family:var(--font-body);color:#fff}
  .card{padding:22px 26px;display:flex;flex-direction:column;gap:10px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:rgba(255,255,255,.7);font-weight:500}
  .stack{display:flex;flex-direction:column;gap:10px;max-width:360px}
  .pill-bad{display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,.18));backdrop-filter:blur(6px);border-radius:36px;padding:8px 22px 8px 8px;border:1px solid rgba(255,255,255,.35)}
  .pill-bad .x{width:36px;height:36px;border-radius:9999px;background:linear-gradient(180deg,#F25C44,#A82516);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;font-size:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 6px rgba(0,0,0,.18)}
  .pill-bad .t{font-family:var(--font-display);font-weight:700;text-transform:none;color:var(--atria-navy-900);font-size:18px;letter-spacing:0}
</style></head>
<body>
<div class="card">
  <div class="label">Status pill — "mala fe" (bad faith) action</div>
  <div class="stack">
    <div class="pill-bad"><span class="x">✕</span><span class="t">Ocultar bienes o ingresos</span></div>
    <div class="pill-bad"><span class="x">✕</span><span class="t">Dar información falsa</span></div>
    <div class="pill-bad"><span class="x">✕</span><span class="t">Inventar deudas</span></div>
  </div>
</div>
</body></html>
