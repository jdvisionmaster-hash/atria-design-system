<!doctype html>
<!-- @dsCard group="Spacing" name="Corner radii" subtitle="xs 6 → xl 36 → pill" viewport="700x160" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:10px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg-3);font-weight:500}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ratom{display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-body);font-weight:600;color:#fff;border-radius:4px}
  .legend{font-size:12px;color:var(--fg-2)}
</style></head>
<body>
<div class="card">
  <div class="label">Radius scale &nbsp;·&nbsp; xs 6 / sm 10 / md 16 / lg 24 / xl 36 / card 28 / pill ∞</div>
  <div class="row">
    <span class="ratom" style="width:64px;height:64px;background:var(--atria-navy-900);border-radius:6px">6</span>
    <span class="ratom" style="width:64px;height:64px;background:var(--atria-navy-900);border-radius:10px">10</span>
    <span class="ratom" style="width:64px;height:64px;background:var(--atria-navy-900);border-radius:16px">16</span>
    <span class="ratom" style="width:64px;height:64px;background:var(--atria-navy-900);border-radius:24px">24</span>
    <span class="ratom" style="width:80px;height:64px;background:var(--atria-navy-900);border-radius:28px">28 card</span>
    <span class="ratom" style="width:80px;height:64px;background:var(--atria-navy-900);border-radius:36px">36 chip</span>
    <span class="ratom" style="width:120px;height:36px;background:var(--atria-red-500);border-radius:9999px">pill</span>
  </div>
</div>
</body></html>
