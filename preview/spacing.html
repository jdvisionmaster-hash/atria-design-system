<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96" viewport="700x190" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
  .card{padding:18px 22px;display:flex;flex-direction:column;gap:10px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg-3);font-weight:500}
  .scale{display:flex;align-items:flex-end;gap:10px}
  .stick{background:var(--atria-navy-900);border-radius:4px;color:#fff;font-size:10px;font-family:var(--font-body);text-align:center;padding-top:4px}
</style></head>
<body>
<div class="card">
  <div class="label">Spacing scale — 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 px</div>
  <div class="scale">
    <div class="stick" style="width:4px;height:24px">4</div>
    <div class="stick" style="width:8px;height:30px">8</div>
    <div class="stick" style="width:12px;height:38px">12</div>
    <div class="stick" style="width:16px;height:48px">16</div>
    <div class="stick" style="width:24px;height:60px">24</div>
    <div class="stick" style="width:32px;height:74px">32</div>
    <div class="stick" style="width:48px;height:90px">48</div>
    <div class="stick" style="width:64px;height:108px">64</div>
    <div class="stick" style="width:96px;height:128px">96</div>
  </div>
</div>
</body></html>
