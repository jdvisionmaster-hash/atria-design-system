<!doctype html>
<!-- @dsCard group="Type" name="Display type · Oswald" subtitle="All-caps headline face, weight 600–700" viewport="700x280" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
  .card{padding:22px 26px;display:flex;flex-direction:column;gap:14px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg-3);font-weight:500}
  .row{display:flex;align-items:baseline;gap:18px;border-bottom:1px solid var(--border-on-light);padding-bottom:8px}
  .row .meta{font-family:var(--font-body);font-size:11px;color:var(--fg-3);min-width:120px}
  .sample{font-family:var(--font-display);text-transform:uppercase;line-height:.95;color:var(--atria-navy-900);font-weight:700;letter-spacing:-.01em}
</style></head>
<body>
<div class="card">
  <div class="label">Oswald — display face. Always uppercase, weight 600–700.</div>
  <div class="row"><div class="meta">Display XL · 96/0.95</div><div class="sample" style="font-size:64px">Insolvencia</div></div>
  <div class="row"><div class="meta">Display LG · 72/0.95</div><div class="sample" style="font-size:52px">Buena fe</div></div>
  <div class="row"><div class="meta">H1 · 44/1.1</div><div class="sample" style="font-size:34px">Te ayudamos con tu caso</div></div>
  <div class="row"><div class="meta">H3 / Eyebrow · 13/.12em</div><div class="sample" style="font-size:14px;letter-spacing:.12em;font-weight:500">Consultoría Legal y Financiera</div></div>
</div>
</body></html>
