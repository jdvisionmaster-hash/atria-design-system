<!doctype html>
<!-- @dsCard group="Type" name="Inline emphasis" subtitle="Red pill, gold outline, underline — never bold" viewport="700x230" -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg-page);font-family:var(--font-body);color:var(--fg-1)}
  .card{padding:20px;display:flex;flex-direction:column;gap:14px}
  .label{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--fg-3);font-weight:500}
  .demo{font-family:var(--font-display);font-weight:700;text-transform:uppercase;line-height:1;color:var(--atria-ink);font-size:34px;letter-spacing:-.01em}
  .demo .light{color:var(--fg-2);font-weight:400}
  .row{display:flex;gap:18px;flex-wrap:wrap}
</style></head>
<body>
<div class="card">
  <div class="label">Inline emphasis — colored pills, gold outline, red underline</div>
  <div class="demo">La insolvencia <span class="atria-highlight-red">No</span> es un escape</div>
  <div class="demo">Comenta: <span class="atria-highlight-gold">"Insolvencia"</span></div>
  <div class="demo">Y usarla <span class="atria-underline" style="color:var(--atria-red-500)">MAL</span> puede salirte muy <span style="color:var(--atria-red-500)">CARO…</span></div>
</div>
</body></html>
