<!doctype html>
<!-- @dsCard group="UI Kit — Marketing" name="UI kit · Marketing site" subtitle="Speculative recreation — nav, hero, services, process, FAQ, CTA, footer" viewport="1440x900" -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>ATRIA · Sitio marketing</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="./marketing-kit.css">
<style>
  html, body { margin: 0; }
  body { background: var(--atria-paper); }
</style>
</head>
<body class="atria-mk" data-screen-label="ATRIA marketing site">

<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="./Nav.jsx"></script>
<script type="text/babel" src="./Hero.jsx"></script>
<script type="text/babel" src="./ServiceCard.jsx"></script>
<script type="text/babel" src="./ProcessSteps.jsx"></script>
<script type="text/babel" src="./FaqAccordion.jsx"></script>
<script type="text/babel" src="./Footer.jsx"></script>

<script type="text/babel">
function CtaStrip() {
  return (
    <section className="mk-cta-strip" id="contacto">
      <div className="mk-cta-strip__inner-frame"/>
      <h2>¿Listo para empezar de nuevo?</h2>
      <p>Escríbenos por DM en Instagram o comenta <b>"INSOLVENCIA"</b> en cualquier publicación.
         Te respondemos en menos de 24 horas con los siguientes pasos para tu caso.</p>
      <a className="mk-cta" href="#">Hablar con un asesor →</a>
    </section>
  );
}

function App() {
  const services = [
    { num: "01", title: "Insolvencia económica", body: "Procedimiento ante juez para reorganizar tus deudas con respaldo legal — sin perder lo esencial." },
    { num: "02", title: "Negociación de deudas", body: "Acuerdos directos con bancos y acreedores para reducir intereses y reestructurar plazos." },
    { num: "03", title: "Liquidación patrimonial", body: "Si la reorganización no es viable, gestionamos la liquidación ordenada de tu patrimonio." },
  ];
  const steps = [
    { title: "Diagnóstico", body: "Revisamos tu situación financiera y verificamos si calificas para el proceso de insolvencia." },
    { title: "Negociación", body: "Convocamos a tus acreedores y proponemos un acuerdo de pago realista y sostenible." },
    { title: "Acuerdo judicial", body: "El juez aprueba el acuerdo, suspendiendo cobros y procesos ejecutivos en tu contra." },
    { title: "Recuperación", body: "Cumples el plan acordado y vuelves a empezar con tu vida financiera limpia." },
  ];
  const faqs = [
    { q: "¿Qué es la insolvencia económica?", a: "Es un proceso legal regulado por la Ley 1564 de 2012 (Código General del Proceso) que permite a personas naturales no comerciantes reorganizar sus deudas con sus acreedores con respaldo de un juez. NO es dejar de pagar — es pagar de manera ordenada lo que realmente puedes." },
    { q: "¿Puedo perder mi casa o mi carro?", a: "Depende. Los bienes inembargables (vivienda en patrimonio de familia, salario mínimo, herramientas de trabajo) están protegidos. Sobre los demás bienes, el acuerdo con tus acreedores definirá cómo se manejan." },
    { q: "¿Cuánto dura el proceso?", a: "Entre 3 y 12 meses para llegar a un acuerdo. El plan de pagos acordado puede extenderse hasta 5 años." },
    { q: "¿Tengo que actuar de buena fe?", a: "Sí, y esto es fundamental. Ocultar bienes, dar información falsa o inventar deudas hace que pierdas el proceso, te sanciones, y respondas por los daños. La insolvencia es un derecho, pero NO es una excusa para evadir pagos." },
  ];
  return (
    <>
      <Nav/>
      <Hero/>

      <section className="mk-section" id="servicios">
        <div className="mk-section__heading">
          <div className="eyebrow">Servicios</div>
          <h2>Una salida legal, paso a paso</h2>
          <p>Tres caminos para que recuperes el control de tu vida financiera, con acompañamiento legal de principio a fin.</p>
        </div>
        <div className="mk-services">
          {services.map(s => <ServiceCard key={s.num} {...s}/>)}
        </div>
      </section>

      <section className="mk-section mk-section--dark" id="proceso">
        <div className="mk-section__heading">
          <div className="eyebrow">El proceso</div>
          <h2>De la deuda al alivio</h2>
          <p>Cuatro etapas claras. Tú aportas la información, nosotros llevamos el proceso ante el juez.</p>
        </div>
        <ProcessSteps items={steps}/>
      </section>

      <section className="mk-section" id="faq">
        <div className="mk-section__heading">
          <div className="eyebrow">Preguntas frecuentes</div>
          <h2>Lo que más nos preguntan</h2>
          <p>Si tu duda no está aquí, escríbenos por DM en Instagram. Respondemos personalmente.</p>
        </div>
        <FaqAccordion items={faqs}/>
      </section>

      <CtaStrip/>
      <Footer/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body></html>
